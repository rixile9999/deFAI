[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sejong-defai"
version = "1.1.0"
description = "Sejong University deFAI federated learning research modules (years 1-3), attachable to the KIST deFAI system"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "flwr==1.42.0",
  "torch>=2.6",
  "torchvision>=0.21",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "threadpoolctl>=3.1",
  "Flask>=3.1,<4",
  "requests>=2.31",
  "psutil>=5.9",
  "matplotlib>=3.8",
  "cryptography>=41",
]

[project.optional-dependencies]
kist = ["flwr-datasets[vision]==0.6.1", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
defai-research = "defai_research.cli:main"
defai-addons = "defai_addons.cli:main"

[tool.setuptools]
packages = [
  "fl_core",
  "hierarchical_fl",
  "security_sim",
  "scenario_test",
  "network_cost",
  "graph_pruning",
  "layer_kd",
  "data_imbalance",
  "defai_research",
  "defai_research.compression",
  "defai_research.federated",
  "defai_research.metrics",
  "defai_research.metrics.studies",
  "defai_addons",
  "defai_addons.common",
  "defai_addons.fl",
  "defai_addons.integration",
  "defai_addons.monitor",
  "defai_addons.compare",
  "defai_addons.multimodal",
  "defai_addons.multimodal.baselines",
]

[tool.setuptools.package-dir]
"fl_core" = "common/src/fl_core"
"defai_addons" = "common/src/defai_addons"
"defai_addons.common" = "common/src/defai_addons/common"
"defai_addons.fl" = "common/src/defai_addons/fl"
"defai_addons.integration" = "common/src/defai_addons/integration"
"hierarchical_fl" = "1_simulation/1-1_hierarchical_fl/src/hierarchical_fl"
"defai_addons.monitor" = "1_simulation/1-2_fl_visualization/src/defai_addons/monitor"
"security_sim" = "1_simulation/1-3_security/src/security_sim"
"defai_addons.compare" = "1_simulation/1-4_distributed_comparison/src/defai_addons/compare"
"scenario_test" = "1_simulation/1-5_scenario_test/src/scenario_test"
"network_cost" = "1_simulation/1-6_network_cost/src/network_cost"
"graph_pruning" = "2_analysis_speed/2-1_graph_pruning/src/graph_pruning"
"layer_kd" = "2_analysis_speed/2-2_knowledge_distillation/src/layer_kd"
"defai_research" = "2_analysis_speed/2-3_mapreduce_analysis/src/defai_research"
"defai_research.compression" = "2_analysis_speed/2-3_mapreduce_analysis/src/defai_research/compression"
"defai_research.federated" = "2_analysis_speed/2-4_graph_deduplication/src/defai_research/federated"
"defai_addons.multimodal" = "3_heterogeneous_data/3-1_multimodal/src/defai_addons/multimodal"
"defai_addons.multimodal.baselines" = "3_heterogeneous_data/3-1_multimodal/src/defai_addons/multimodal/baselines"
"defai_research.metrics" = "3_heterogeneous_data/3-2_fl_metrics/src/defai_research/metrics"
"defai_research.metrics.studies" = "3_heterogeneous_data/3-2_fl_metrics/src/defai_research/metrics/studies"
"data_imbalance" = "3_heterogeneous_data/3-3_data_imbalance/src/data_imbalance"

[tool.setuptools.package-data]
"hierarchical_fl" = ["templates/*.html", "static/*"]
"defai_addons.monitor" = ["templates/*.html", "static/*.js", "static/*.css"]
"defai_research.metrics" = ["*.json"]
"defai_research.metrics.studies" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
